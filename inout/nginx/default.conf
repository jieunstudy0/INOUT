# ================================================================
# INOUT Nginx 설정 — 프론트엔드 정적 서빙 + 백엔드 리버스 프록시
#
# 전제 조건:
# - "backend"는 docker-compose 상의 백엔드(Spring Boot) 서비스명이다.
#   docker-compose.yml에서 서비스명을 다르게 지정한다면 아래 upstream 값을 함께 수정해야 한다.
# - frontend/src/api/apiClient.js는 baseURL='/api' 상대경로를 사용하므로,
#   프론트 정적 파일과 백엔드 API가 반드시 "동일 오리진"으로 노출되어야 한다.
#   이 설정 파일이 그 역할(리버스 프록시)을 담당한다.
# ================================================================

upstream inout_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;   # 상품 이미지 / 문의 첨부파일 업로드 허용 크기

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── React SPA 정적 파일 ──────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 포함된 빌드 산출물(js/css 등)은 장기 캐시, index.html은 매번 재검증
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # ── 백엔드 REST API ───────────────────────────────────────
    location /api/ {
        proxy_pass http://inout_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 업로드 파일(상품 이미지 등 공개 정적 자원) ────────────
    # 백엔드 WebConfig의 "/uploads/**" 매핑(permitAll)과 대응된다.
    location /uploads/ {
        proxy_pass http://inout_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React SPA OAuth2 콜백 (정적 파일) ────────────────────
    # /oauth2/callback?accessToken=... 는 프론트엔드 라우트(OAuth2CallbackPage)다.
    # 아래 exact-match(=)가 prefix-match(/oauth2/)보다 우선하므로 SPA index.html을 돌려준다.
    location = /oauth2/callback {
        try_files $uri /index.html;
    }

    # ── OAuth2 소셜 로그인 시작(인가) 요청 ────────────────────
    location /oauth2/ {
        proxy_pass http://inout_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OAuth2 소셜 플랫폼 → 서버 콜백 ────────────────────────
    location /login/oauth2/ {
        proxy_pass http://inout_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 컨테이너/로드밸런서 헬스체크 ──────────────────────────
    location /actuator/health {
        proxy_pass http://inout_backend;
        proxy_set_header Host $host;
    }
}
