# @DataJpaTest + H2: 스키마 자동 생성 (메인 application의 ddl-auto=none 무시)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# H2 예약어(user 등)로 인한 DDL 오류 방지
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# 전체 컨텍스트 테스트(@SpringBootTest)용 인메모리 DB (로컬 MySQL 미기동 시에도 기동)
spring.datasource.url=jdbc:h2:mem:inouttest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 전체 컨텍스트 테스트 시 중복 Bean 정의 허용
spring.main.allow-bean-definition-overriding=true
# JwtTokenProvider 초기화용 (32바이트 hex, 테스트 전용)
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
# 메일/링크 등에서 참조하는 서버 URL (전체 컨텍스트 테스트용)
app.server-url=http://localhost:8080

# ===============================
# OAuth2 소셜 로그인 (테스트 전용 더미)
# SecurityConfig가 .oauth2Login(...)을 사용하므로 전체 컨텍스트 테스트
# (@SpringBootTest, 예: InoutApplicationTests, SecurityPathAclSmokeTest)가
# ClientRegistrationRepository 빈을 필요로 한다. 실제 네트워크 호출은 발생하지 않는다
# (로그인을 실제로 시작하는 테스트가 없는 한 등록 정보만 파싱될 뿐이다).
spring.security.oauth2.client.registration.google.client-id=TEST_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=TEST_GOOGLE_CLIENT_SECRET

spring.security.oauth2.client.registration.kakao.client-id=TEST_KAKAO_CLIENT_ID
spring.security.oauth2.client.registration.kakao.client-secret=TEST_KAKAO_CLIENT_SECRET
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=TEST_NAVER_CLIENT_ID
spring.security.oauth2.client.registration.naver.client-secret=TEST_NAVER_CLIENT_SECRET
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# 성공/실패 핸들러가 참조하는 프론트엔드 리다이렉트 베이스 (테스트 전용)
app.oauth2.authorized-redirect-uri=http://localhost:5173/oauth2/callback
