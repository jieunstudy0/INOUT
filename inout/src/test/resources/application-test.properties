# 동시성/통합 테스트용 프로파일 (application.properties 기본값을 보강)
# @ActiveProfiles("test") 또는 spring.profiles.active=test 로 활성화
spring.datasource.hikari.maximum-pool-size=120
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-lifetime=600000

# AI 스케줄러는 테스트에서도 기본 OFF
ai.scheduler.enabled=false
