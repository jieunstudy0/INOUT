# ================================================================
# 운영 환경 설정 (application-prod.properties)
# 실행 방법: 환경 변수 SPRING_PROFILES_ACTIVE=prod
#
# 모든 민감 정보는 환경 변수 또는 Secret Manager로 주입한다.
# Docker Compose 예시:
#   environment:
#     SPRING_PROFILES_ACTIVE: prod
#     SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/inout?...
#     SPRING_DATASOURCE_USERNAME: inout_user
#     SPRING_DATASOURCE_PASSWORD: (secret)
#     JWT_SECRET: (secret)
#     ...
# ================================================================

# ===============================
# Server URL
# ===============================
# nginx가 X-Forwarded-Proto/X-Forwarded-For 헤더를 붙여 프록시하므로, Spring이 이를 신뢰하고
# request.isSecure()/getScheme() 등을 실제 프로토콜(HTTPS) 기준으로 판단하도록 한다.
# (OAuth2AuthenticationSuccessHandler의 refreshToken 쿠키 Secure 플래그가 이 값에 의존한다.)
server.forward-headers-strategy=framework
app.server-url=${APP_SERVER_URL:https://your-production-domain.com}
app.oauth2.authorized-redirect-uri=${APP_FRONTEND_URL:https://your-production-domain.com}/oauth2/callback
app.oauth2.onboarding-redirect-uri=${APP_FRONTEND_URL:https://your-production-domain.com}/onboarding/complete-profile
# 운영 프론트엔드 도메인 (쉼표 구분으로 복수 허용 가능)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-production-domain.com}

# ===============================
# Database (운영 MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 운영: 기본은 DDL 자동 변경 금지(validate). SQL 로그 비활성화.
#
# [최초 배포 스키마 생성 가이드]
# 스키마가 아직 없는 최초 배포 시에는 DDL_AUTO=update 환경 변수를 1회만 주입해서 기동하면
# Hibernate가 엔티티 기준으로 테이블을 자동 생성한다. 정상 기동/테이블 생성을 확인한 뒤에는
# 반드시 DDL_AUTO 환경 변수를 제거(또는 validate로 변경)하고 컨테이너를 재기동해야 한다.
# (validate로 되돌리지 않으면 이후 엔티티 변경 시 운영 DB 스키마가 의도치 않게 자동 변경될 수 있다.)
#
#   1) 최초 1회: docker compose run -e DDL_AUTO=update backend   (또는 .env에 DDL_AUTO=update 설정 후 기동)
#   2) 테이블 생성 로그(Hibernate: create table ...) 및 정상 기동 확인
#   3) .env에서 DDL_AUTO 제거(또는 DDL_AUTO=validate로 변경) 후 backend 컨테이너 재기동
#
# 운영 환경이 안정화된 뒤에는 Flyway/Liquibase 같은 마이그레이션 도구 도입을 권장한다.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Redis (운영)
# ===============================
# host는 로컬(localhost) 기본값을 두지 않는다 — docker-compose 내부망에서는 반드시 서비스명(redis)이어야
# 하며, REDIS_HOST 누락 시 "localhost"로 조용히 오작동하는 대신 기동 시점에 즉시 실패해야 한다.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# Gemini AI
# ===============================
gemini.api-key=${GEMINI_API_KEY:}

# ===============================
# Mail
# ===============================
spring.mail.password=${SPRING_MAIL_PASSWORD}

# ===============================
# OAuth2 소셜 로그인 (운영 키 - 환경 변수 필수)
# ===============================
# Google은 HTTPS 도메인 연결 후 실제 키를 .env에 채워야 동작한다.
# IP만 사용하는 1차 배포에서는 더미 기본값으로 기동하고 Google 로그인 버튼은 비활성 상태를 유지한다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:GOOGLE_DUMMY_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:GOOGLE_DUMMY_CLIENT_SECRET}

# Kakao/Naver는 Spring Security의 CommonOAuth2Provider에 없으므로 provider 엔드포인트를
# 명시하지 않으면 기동 시점에 "Provider ID must be specified for client registration 'kakao'"
# 로 실패한다. redirect-uri의 {baseUrl}은 server.forward-headers-strategy=framework(위 설정) 덕분에
# nginx가 전달하는 X-Forwarded-Proto/Host 기준으로 올바르게(https://실제도메인) 계산된다.
#
# client-id/secret에 :not-configured 기본값을 둔 이유: Kakao(사업자등록 전이라 이메일 동의항목
# 미확보)/Naver(검수 전)는 프론트(LoginPage.jsx OAUTH_PROVIDERS[].enabled=false)에서 버튼을 아직
# 노출하지 않고 있다. 이 기본값이 없으면 KAKAO_CLIENT_ID/NAVER_CLIENT_ID를 .env에 채우기 전까지
# PlaceholderResolutionException으로 backend 컨테이너가 기동 자체에 실패한다 — Google만으로도
# 먼저 배포할 수 있도록 하기 위한 안전장치다. 실제 Kakao/Naver 키가 준비되면 .env에 값을 채우고
# LoginPage.jsx의 enabled를 true로 바꾸면 된다. Google은 오늘 바로 써야 하므로 기본값을 두지
# 않았다 — GOOGLE_CLIENT_ID/SECRET 누락 시에는 의도대로 기동이 즉시 실패한다.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ===============================
# Swagger (운영에서는 완전 비활성화)
# ===============================
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===============================
# Actuator (운영 헬스체크 최소 노출)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# K8s / Docker 컨테이너 Readiness·Liveness probe 활성화
management.endpoint.health.probes.enabled=true

# ===============================
# Logging (운영 로그 레벨)
# ===============================
logging.level.root=WARN
logging.level.com.jstudy.inout=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ===============================
# 파일 업로드 경로 (컨테이너 볼륨 마운트 경로)
# ===============================
app.upload.path=${UPLOAD_PATH:/app/uploads}

# ===============================
# AI 스케줄러 (Gemini 요금 방지 — 운영 기본 OFF, 필요 시 환경변수로만 켬)
# ===============================
ai.scheduler.enabled=${AI_SCHEDULER_ENABLED:false}
deposit.scheduler.enabled=${DEPOSIT_SCHEDULER_ENABLED:false}
