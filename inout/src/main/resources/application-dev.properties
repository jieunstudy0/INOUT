# ================================================================
# 개발 환경 설정 (application-dev.properties)
# 실행 방법: -Dspring.profiles.active=dev  또는
#            환경 변수 SPRING_PROFILES_ACTIVE=dev
# ================================================================

# ── Secret 파일 명시적 임포트 ──────────────────────────────────────────────────
# spring.config.import 는 Spring Boot 2.4+ 공식 방식으로,
# 이 프로필 전용 파일이 로드될 때 application-secret.properties 를 직접 끌어온다.
#
# 이 선언이 필요한 이유:
#   application.properties 의 spring.profiles.group.dev=secret 은
#   IDE 가 SPRING_PROFILES_ACTIVE=dev 를 환경변수로 직접 주입하는 경우
#   group 확장이 실행되지 않아 application-secret.properties 가 로드되지 않을 수 있다.
#   (증상: spring.datasource.password 가 빈 값 → "Access denied using password: NO")
#
# optional: 접두사 — application-secret.properties 가 없는 CI/테스트 환경에서는
#   파일이 없어도 기동이 실패하지 않는다.
spring.config.import=optional:classpath:application-secret.properties

# ===============================
# Server URL (프론트엔드 Vite dev 서버)
# ===============================
app.server-url=http://localhost:5173
app.oauth2.authorized-redirect-uri=http://localhost:5173/oauth2/callback
app.oauth2.onboarding-redirect-uri=http://localhost:5173/onboarding/complete-profile
app.cors.allowed-origins=http://localhost:5173

# ===============================
# Database (로컬 MySQL)
# ===============================

# rewriteBatchedStatements=true — JdbcTemplate.batchUpdate()(MassDataGeneratorService 등)가 여러 INSERT를
# 하나의 다중 VALUES INSERT 문으로 재작성하도록 하여 대량 삽입 성능을 크게 향상시킨다 (MySQL Connector/J 표준 옵션).
spring.datasource.url=jdbc:mysql://localhost:3306/inout?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root

# 개발 환경에서는 SQL 로그 활성화
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Redis (로컬)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Redis 미기동 시 커맨드가 장시간 블로킹되지 않도록 짧게 실패 → CacheErrorHandler / ResilientCache로 우회
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=1s

# ===============================
# OAuth2 소셜 로그인 (더미 키 - 로컬 테스트용)
# 실제 키는 application-secret.properties에 입력하거나 환경 변수로 주입
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:GOOGLE_DUMMY_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:GOOGLE_DUMMY_CLIENT_SECRET}

# Kakao/Naver는 Spring Security의 CommonOAuth2Provider(google/github/facebook/okta)에 포함되어
# 있지 않으므로, client-id/secret만으로는 등록이 완성되지 않는다(엔드포인트를 알 수 없어
# ClientRegistrationRepository 빈 생성 시점에 "Provider ID must be specified for client
# registration 'kakao'" 예외가 발생한다). authorization-grant-type/scope와
# spring.security.oauth2.client.provider.{id}.* 엔드포인트를 아래처럼 명시해야 한다.
spring.security.oauth2.client.registration.kakao.client-id=KAKAO_DUMMY_CLIENT_ID
spring.security.oauth2.client.registration.kakao.client-secret=KAKAO_DUMMY_CLIENT_SECRET
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# account_email 스코프는 카카오 개발자 콘솔 > 카카오 로그인 > 동의항목에서 "이메일" 항목을
# 활성화(및 필요 시 비즈 앱 전환)해야 실제로 이메일이 내려온다. 미설정 시 email이 null이 되어
# CustomOAuth2UserService가 로그인을 거부한다.
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=NAVER_DUMMY_CLIENT_ID
spring.security.oauth2.client.registration.naver.client-secret=NAVER_DUMMY_CLIENT_SECRET
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ===============================
# Swagger (개발 환경에서는 활성화)
# ===============================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ===============================
# AI 스케줄러 (Gemini 요금 방지 — 기본 OFF)
# ===============================
ai.scheduler.enabled=false
deposit.scheduler.enabled=false
