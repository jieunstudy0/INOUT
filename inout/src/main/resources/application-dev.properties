# ================================================================
# 개발 환경 설정 (application-dev.properties)
# 실행 방법: -Dspring.profiles.active=dev  또는
#            환경 변수 SPRING_PROFILES_ACTIVE=dev
# ================================================================

# application-secret.properties (로컬 전용, .gitignore 처리)에서
# DB 비밀번호, JWT Secret, Gemini API Key, 메일 비밀번호 로드
# (실제 include 선언은 application.properties의 spring.profiles.group.dev=secret 에 있다 —
#  Spring Boot 3.x는 프로필 전용 파일 안에서의 spring.profiles.include 선언을 허용하지 않는다.)

# ===============================
# Server URL (프론트엔드 Vite dev 서버)
# ===============================
app.server-url=http://localhost:5173
app.oauth2.authorized-redirect-uri=http://localhost:5173/oauth2/callback
app.cors.allowed-origins=http://localhost:5173

# ===============================
# Database (로컬 MySQL)
# ===============================

# rewriteBatchedStatements=true — JdbcTemplate.batchUpdate()(MassDataGeneratorService 등)가 여러 INSERT를
# 하나의 다중 VALUES INSERT 문으로 재작성하도록 하여 대량 삽입 성능을 크게 향상시킨다 (MySQL Connector/J 표준 옵션).
spring.datasource.url=jdbc:mysql://localhost:3306/inout?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root

# 개발 환경에서는 SQL 로그 활성화
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Redis (로컬)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# OAuth2 소셜 로그인 (더미 키 - 로컬 테스트용)
# 실제 키는 application-secret.properties에 입력하거나 환경 변수로 주입
# ===============================
spring.security.oauth2.client.registration.google.client-id=GOOGLE_DUMMY_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=GOOGLE_DUMMY_CLIENT_SECRET

spring.security.oauth2.client.registration.kakao.client-id=KAKAO_DUMMY_CLIENT_ID
spring.security.oauth2.client.registration.kakao.client-secret=KAKAO_DUMMY_CLIENT_SECRET

spring.security.oauth2.client.registration.naver.client-id=NAVER_DUMMY_CLIENT_ID
spring.security.oauth2.client.registration.naver.client-secret=NAVER_DUMMY_CLIENT_SECRET

# ===============================
# Swagger (개발 환경에서는 활성화)
# ===============================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
