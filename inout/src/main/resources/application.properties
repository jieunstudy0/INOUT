# 최상단에 추가 (로컬에서 secret 파일이 있으면 무조건 읽어옴)
spring.config.import=optional:classpath:application-secret.properties

spring.application.name=inout
spring.datasource.url=jdbc:mysql://localhost:3306/inout?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${spring.datasource.password:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

default-character-set=utf8

server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8

spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.mail.host=smtp.kakao.com
spring.mail.port=465
spring.mail.username=jieunstudy@kakao.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.kakao.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# 프로필을 명시하지 않고(예: IDE에서 바로 InoutApplication 실행, ./gradlew bootRun을
# 아무 옵션 없이 실행) 기동하는 경우를 위한 기본값이다. 시스템 환경변수/실행 인자로 주어지는
# SPRING_PROFILES_ACTIVE(예: Docker의 prod)가 항상 이 기본값보다 우선하므로 운영에는 영향이 없다.
spring.profiles.active=dev
app.server-url=http://localhost:8080
# secret은 로컬/개발(dev)에서만 함께 활성화한다.
# spring.profiles.include=secret 을 기본 파일에 두면 prod에도 secret이 붙고
# DummyDataInitializer가 운영 DB를 초기화하는 P0가 된다.
# Spring Boot 3.x는 프로필 전용 파일(application-dev.properties) 안의
# spring.profiles.include 를 허용하지 않으므로 group으로 분리한다.
spring.profiles.group.dev=secret

# ===============================
# OAuth2 소셜 로그인 — 프로필 무관 기본값(안전장치)
# ===============================
# 이 블록이 없던 상태에서 SecurityConfig에 .oauth2Login(...)을 추가하고 나니,
# spring.profiles.active가 어떤 이유로든 dev/prod로 해석되지 않는 상태로 기동하면(예: 위
# spring.profiles.active=dev 기본값이 시스템 프로퍼티/커스텀 IDE 실행 설정으로 덮어써진 경우,
# 혹은 spring.profiles.active=local로 기동한 경우 — application-local.yml에는 OAuth2 설정이
# 없다) spring.security.oauth2.client.registration.* 이 완전히 비어 있는 상태가 되어
# ClientRegistrationRepository 빈 자체가 생성되지 않고, oauth2Login()이 그 빈을 직접
# ApplicationContext.getBean(...)으로 찾다가
# "No qualifying bean of type ClientRegistrationRepository ... could not be found"
# 로 기동에 실패한다.
#
# 그래서 프로필과 무관하게 항상 최소 하나 이상의 유효한(더미라도) registration이 존재하도록
# 여기(비-프로필 전용 파일)에 기본값을 둔다. dev/prod의 동일 키 선언이 이 값을 그대로
# 덮어쓰므로(프로필 전용 파일이 항상 우선), 실제 배포(prod)에서 GOOGLE_CLIENT_ID를 빠뜨렸을 때
# 조용히 이 더미값으로 기동되는 게 아니라 여전히 즉시 실패한다 — application-prod.properties에
# 남겨둔 ${GOOGLE_CLIENT_ID}(기본값 없음)가 이 기본값을 덮어쓰기 때문이다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:GOOGLE_DUMMY_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:GOOGLE_DUMMY_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.paths-to-exclude=/actuator/**

# AI 스케줄러 (Gemini 호출) — 기본 OFF. 필요 시 true
ai.scheduler.enabled=false

# Gemini 모델 설정
# - gemini-1.5-flash : 경량·빠른 응답, 트래픽 과부하(503) 저항성 우선 (기본값)
# - gemini-2.5-flash : 더 높은 추론 품질, 고부하 시간대 503 가능성 있음
gemini.model=gemini-2.0-flash
