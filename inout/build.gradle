plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jstudy'
version = '0.0.1-SNAPSHOT'
description = 'inout project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
    springdocVersion = '2.8.6'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Utilities & External Tools
    implementation 'net.datafaker:datafaker:2.7.0'
    implementation 'com.github.codemonstur:embedded-redis:1.4.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Lombok (메인)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Lombok (테스트)
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spring MVC 파라미터 바인딩용: 모든 JavaCompile 태스크에 -parameters 옵션 적용 (메인 + 테스트)
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
}

// SpringDoc 라이브러리 버전 고정
configurations.all {
    resolutionStrategy {
        force "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}",
              "org.springdoc:springdoc-openapi-starter-webmvc-api:${springdocVersion}",
              "org.springdoc:springdoc-openapi-starter-common:${springdocVersion}"
    }
}

tasks.named('test') {
	useJUnitPlatform()
}