# ================================================================
# INOUT 운영 배포용 Docker Compose
#
# 사전 준비:
#   1) .env.example을 복사해 같은 디렉터리에 .env 생성 후 실제 값 채우기
#        cp .env.example .env
#   2) docker compose --env-file .env up -d --build
#
# 서비스 구성: mysql(DB) → redis(캐시) → backend(Spring Boot) → frontend(Nginx, 유일한 외부 노출 포트)
# backend/mysql/redis는 내부 네트워크(inout-net)에서만 통신하며 외부에 포트를 노출하지 않는다.
# (필요 시 디버깅용으로만 아래 ports 주석을 해제할 것)
# ================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: inout-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    # ports:
    #   - "3306:3306"   # 로컬에서 DB 툴로 직접 접속해야 할 때만 임시로 해제
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks:
      - inout-net

  redis:
    image: redis:7-alpine
    container_name: inout-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 160m
    networks:
      - inout-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: inout-backend:latest
    container_name: inout-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # AiAutoOrderScheduler(매일 자정)/AiCsScheduler(10분마다)/DeliveryScheduler(매일 9시)는
      # 코드에 zone="Asia/Seoul"을 명시해 컨테이너 타임존과 무관하게 정확히 동작하지만,
      # 로그 타임스탬프 등 전반적인 일관성을 위해 컨테이너 자체 타임존도 한국 시간으로 맞춘다.
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs
    # ports:
    #   - "8080:8080"   # frontend(Nginx)를 거치지 않고 직접 API를 테스트해야 할 때만 임시로 해제
    healthcheck:
      # /actuator/health 는 readiness(외부 의존성 포함) 상태에 따라 503을 반환할 수 있으므로
      # 컨테이너 생존 확인은 liveness 엔드포인트로 수행한다.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 768m
    networks:
      - inout-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: inout-frontend:latest
    container_name: inout-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 64m
    networks:
      - inout-net

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  logs-data:

networks:
  inout-net:
    driver: bridge
